###############################################################
# Content Moderation Engine – GitHub Actions CI/CD Pipeline
# Exam Topics Demonstrated:
#   ✅ GitHub Collaboration  (branch strategy, PR on push)
#   ✅ Maven                 (compile, test, package)
#   ✅ JUnit                 (test reports published)
#   ✅ Jenkins-equivalent    (automated build on every push/PR)
###############################################################

name: CI – Build, Test & Package

on:
  push:
    branches:
      - main
      - feature-severity-engine    # Person 1
      - feature-text-matching      # Person 2
      - feature-strikes-context    # Person 3
      - feature-audit-logs         # Person 4
  pull_request:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 : Build and run all JUnit tests via Maven
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: Maven Build & JUnit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 11 (matches pom.xml)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3. Compile all source code
      - name: Compile source (mvn compile)
        run: mvn compile --no-transfer-progress

      # 4. Compile test classes
      - name: Compile tests (mvn test-compile)
        run: mvn test-compile --no-transfer-progress

      # 5. Run ALL JUnit 5 tests (Surefire plugin)
      - name: Run all JUnit tests (mvn test)
        run: mvn test --no-transfer-progress

      # 6. Publish JUnit test results (shows pass/fail per test in GitHub UI)
      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()                          # run even if tests fail
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name:   'JUnit Test Results'
          fail_on_failure: true

      # 7. Upload Surefire XML reports as a build artifact
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/

      # 8. Package the JAR (skips tests because they already ran)
      - name: Package JAR (mvn package -DskipTests)
        run: mvn package -DskipTests --no-transfer-progress

      # 9. Upload the executable JAR as a build artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContentModerationEngine-jar
          path: target/ContentModerationEngine.jar

  # ──────────────────────────────────────────────────────────
  # JOB 2 : Per-person module tests (shows who owns what)
  # ──────────────────────────────────────────────────────────
  module-tests:
    name: Run per-person module tests
    runs-on: ubuntu-latest
    needs: build-and-test      # only run if the build passed

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compile
        run: mvn test-compile --no-transfer-progress

      # Person 1 tests
      - name: "[Person 1] Severity Engine Tests"
        run: mvn test -Dtest=SeverityEngineTest --no-transfer-progress

      # Person 2 tests
      - name: "[Person 2] Text Matching & Normalization Tests"
        run: mvn test -Dtest=TextMatchingTest --no-transfer-progress

      # Person 3 tests
      - name: "[Person 3] Strike & Context Tests"
        run: mvn test -Dtest=StrikeContextTest --no-transfer-progress

      # Person 4 tests
      - name: "[Person 4] Audit Logger Tests"
        run: mvn test -Dtest=AuditLoggerTest --no-transfer-progress

      # Person 4 integration tests
      - name: "[Person 4] Integration Tests (Full Pipeline)"
        run: mvn test -Dtest=ModerationEngineIntegrationTest --no-transfer-progress
